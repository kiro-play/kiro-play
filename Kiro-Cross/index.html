<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kiro Cross V15</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Press+Start+2P&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fbf6f1;font-family:'Chakra Petch',sans-serif;color:#333;touch-action:none}
body{display:flex;justify-content:center}
#game{position:relative;width:min(100vw,520px);height:100vh;overflow:hidden;background:#65b84a}
#world{position:absolute;inset:0;overflow:hidden;background:#65b84a}
#track{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform}
.zone{position:absolute;left:0;width:100%;overflow:hidden}
.grass{background-color:#63b94b;background-image:radial-gradient(circle at 12px 14px,rgba(255,255,255,.10) 0 2px,transparent 2.5px),radial-gradient(circle at 44px 38px,rgba(35,125,45,.16) 0 3px,transparent 3.5px),radial-gradient(circle at 76px 20px,rgba(35,125,45,.12) 0 2px,transparent 2.5px);background-size:92px 64px;position:absolute;border-top:6px solid #4a9d3b}.grass:before{content:'';position:absolute;left:0;right:0;top:-8px;height:18px;background:url('grass-edge.png') repeat-x center/96px 30px;opacity:.9;z-index:2}
.lane{position:absolute;left:0;width:100%;height:76px;background:#50545a url('pav2.png') repeat;background-size:96px 96px;overflow:hidden}.lane:after{content:'';position:absolute;left:0;right:0;top:50%;height:30px;transform:translateY(-50%);background-repeat:repeat-x;background-position:center;background-size:120px 76px;opacity:.95;pointer-events:none}.lane.road-dashed:after{background-image:url('pav3.png')}.lane.road-double:after{background-image:url('pav4.png')}.lane.road-cross:after{background-image:url('pav5.png');background-size:150px 76px}.lane.road-clean:after{display:none}.lane .drain{position:absolute;right:5px;top:7px;width:58px;height:58px;object-fit:contain;z-index:3;opacity:.95}.lane .sidewalk{position:absolute;left:0;top:0;width:26px;height:76px;object-fit:cover;z-index:2;opacity:.95}

/* Autos reales de Kiro Cross */
.carSprite{position:absolute;width:80px;height:80px;object-fit:contain;z-index:8;pointer-events:none;filter:drop-shadow(0 4px 2px #2226);will-change:left,top,transform}
.roadProp{position:absolute;width:88px;height:88px;object-fit:contain;z-index:5;pointer-events:none;opacity:1;filter:drop-shadow(0 4px 2px #2225)}
.grassProp{position:absolute;object-fit:contain;z-index:4;pointer-events:none;filter:drop-shadow(0 3px 2px #2223)}
.effectFx{position:absolute;width:92px;height:92px;object-fit:contain;z-index:120;pointer-events:none;animation:fx .42s ease-out forwards}
@keyframes fx{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.25);opacity:0}}

#kiro{position:absolute;width:72px;height:72px;object-fit:contain;z-index:50;filter:drop-shadow(0 4px 2px #3335);left:50%;top:0;will-change:transform,left}
.kiroMove{animation:kiroHop .18s ease}
@keyframes kiroHop{0%{transform:translate(-50%,0)}45%{transform:translate(-50%,-13px)}100%{transform:translate(-50%,0)}}
.hud{position:absolute;z-index:100;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.badge{background:#fff;border:2px solid #fff;border-radius:14px;padding:7px 10px;font-weight:700;box-shadow:0 3px 0 #3335}
#score{font-family:'Press Start 2P';font-size:11px}
#lives{font-size:20px;letter-spacing:2px}
.overlay{position:absolute;inset:0;z-index:200;background:#fbf6f1ee;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.overlay h1{font-family:'Press Start 2P';font-size:22px;color:#e35d5b;margin:0 0 16px;line-height:1.4}
.overlay p{font-size:18px;max-width:340px;margin:8px 0 18px}
.btn{border:0;background:#e35d5b;color:#fff;font-family:'Press Start 2P';font-size:12px;padding:16px 20px;border-radius:14px;box-shadow:0 5px 0 #9f3938;cursor:pointer}
.tip{font-size:13px!important;opacity:.75;margin-top:18px!important}
.flash{position:absolute;inset:0;z-index:150;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:hit .3s}
@keyframes hit{0%{opacity:.9}100%{opacity:0}}
.pop{position:absolute;z-index:160;font-family:'Press Start 2P';font-size:13px;color:#fff;text-shadow:2px 2px #333;animation:pop .7s forwards;pointer-events:none}
@keyframes pop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
</style>
</head>
<body>
<div id="game">
  <div id="world">
    <div id="track"></div>
    <img id="kiro" src="Idle.png" alt="Kiro">
    <div class="flash" id="flash"></div>
  </div>
  <div class="hud"><div class="badge" id="score">0 m</div><div class="badge" id="lives">❤️❤️❤️</div></div>

  <div class="overlay" id="start">
    <h1>🚗 KIRO CROSS</h1>
    <p>Ayudá a Kiro a cruzar la calle sin que lo atropellen.</p>
    <button class="btn" id="play">JUGAR</button>
    <p class="tip">📱 Celular: deslizá ↑ ↓ ← →<br>💻 PC: usá las flechas o WASD<br><br>⬆️ Cada ↑ sube un carril<br>🌱 El camino aparece a medida que avanzás</p>
  </div>

  <div class="overlay" id="gameover" style="display:none">
    <h1>💥 GAME OVER</h1>
    <p id="final">Llegaste a 0 m</p>
    <button class="btn" id="again">REVANCHA</button>
  </div>
</div>

<script>
const game=document.querySelector('#game');
const track=document.querySelector('#track');
const kiro=document.querySelector('#kiro');
const scoreEl=document.querySelector('#score');
const livesEl=document.querySelector('#lives');
const start=document.querySelector('#start');
const over=document.querySelector('#gameover');
const final=document.querySelector('#final');
const flash=document.querySelector('#flash');

const W=()=>game.clientWidth, H=()=>game.clientHeight;
const COLS=5, LANE_H=76, KIRO=72;

let col=2, row=0, lives=3, running=false, raf=0, last=0;
let cameraY=0, targetCameraY=0, moveBusy=false, cars=[], speed=115;
let laneSpawnAt={};
let obstacles=[];
let touchStart=null, grassHeight=0;

function colX(c){ return c*(W()/COLS)+(W()/COLS-KIRO)/2; }

/* La posición del mundo es una escalera:
   césped abajo -> carril 1 arriba -> carril 2 -> carril 3...
   cameraY hace que el escenario se deslice hacia abajo cuando Kiro progresa. */
function baseRoadY(){
  return H()-185;
}
function laneWorldY(index){
  return baseRoadY() - index*LANE_H;
}
function screenLaneY(index){
  return laneWorldY(index) + cameraY;
}
function screenKiroY(){
  return baseRoadY() - row*LANE_H + cameraY - 2;
}
function updateKiro(){
  kiro.style.left=colX(col)+'px';
  kiro.style.top=screenKiroY()+'px';
}
function updateHud(){
  scoreEl.textContent=row+' m';
  livesEl.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
}

const CAR_ASSETS=Array.from({length:17},(_,i)=>`car${String(i+1).padStart(2,'0')}.png`);
const ROAD_PROPS=['obstacle1.png','obstacle2.png','obstacle3.png','obstacle4.png','obstacle5.png','obstacle6.png','obstacle7.png','obstacle8.png'];
const GRASS_PROPS=['bush1.png','bush2.png','tree.png'];

function createCar(laneIndex, directionOverride=null, offset=0){
  const el=document.createElement('img');
  const asset=CAR_ASSETS[Math.floor(Math.random()*CAR_ASSETS.length)];
  el.className='carSprite';
  el.src=asset;
  const dir=directionOverride ?? (Math.random()<.5?1:-1);
  let startX;
  if(dir>0) startX=-95-offset;
  else startX=W()+25+offset;
  el.style.left=startX+'px';
  el.style.top=(laneWorldY(laneIndex)+2)+'px';
  el.style.transform=dir>0?'rotate(90deg)':'rotate(-90deg)';
  track.appendChild(el);
  cars.push({el,lane:laneIndex,dir,x:startX,hit:false});
}

function addLaneProps(lane,index){
  if(index<1) return;

  // Obstáculos REALES: pocos y espaciados para que el recorrido siga siendo jugable.
  // Aparecen también en columnas centrales, pero nunca llenamos un carril de obstáculos.
  if(index%4===0 || (index>10 && index%7===0)){
    const src=ROAD_PROPS[(Math.floor(index/2))%ROAD_PROPS.length];
    const choices=[1,2,3];
    const colIndex=choices[(index*3)%choices.length];
    const cw=W()/COLS;
    const size=94;
    const img=document.createElement('img');
    img.className='roadProp'; img.src=src;
    img.style.left=(colIndex*cw+(cw-size)/2)+'px';
    img.style.top=((76-size)/2)+'px';
    img.style.width=size+'px'; img.style.height=size+'px';
    lane.appendChild(img);
    obstacles.push({el:img,lane:index,col:colIndex,hit:false});
  }

  // Drenajes decorativos, siempre al borde.
  if(index%4===0){
    const drain=document.createElement('img'); drain.className='drain'; drain.src='pav1.png'; lane.appendChild(drain);
  }
}

function createLane(index){
  if(track.querySelector('.lane[data-index="'+index+'"]')) return;
  const lane=document.createElement('div');
  lane.className='lane'; lane.dataset.index=index;
  // Alternamos los pavimentos visuales para que el camino no sea una copia
  // idéntica en todos los carriles.
  const roadTypes=['road-dashed','road-double','road-clean','road-dashed','road-cross','road-double','road-clean'];
  lane.classList.add(roadTypes[(index-1)%roadTypes.length]);
  lane.style.top=screenLaneY(index)+'px';
  track.appendChild(lane);
  // Un pequeño tramo de vereda lateral usa pav6 sin cambiar la calle.
  if(index%2===1){
    const sidewalk=document.createElement('img'); sidewalk.className='sidewalk'; sidewalk.src='pav6.png'; lane.appendChild(sidewalk);
  }
  addLaneProps(lane,index);
  const dir=index%2===0?1:-1;
  createCar(index,dir,40+Math.random()*120);
  laneSpawnAt[index]=performance.now();
  if(index>=2 && Math.random()<.55) createCar(index,-dir,260+Math.random()*220);
}

function ensureTraffic(now){
  // Mantenemos tráfico en los carriles cercanos a Kiro.
  // Desde el nivel 15 aumenta claramente la dificultad:
  // más autos, más frecuencia y tráfico en ambos sentidos.
  const minLane=Math.max(1,row-2);
  const maxLane=row+10;
  const hardMode=row>=15;

  for(let i=minLane;i<=maxLane;i++){
    createLane(i);

    const laneCars=cars.filter(c=>c.lane===i);
    const count=laneCars.length;
    const lastSpawn=laneSpawnAt[i] || 0;

    if(!hardMode){
      // Niveles 1-14: tráfico moderado.
      if(count===0 && now-lastSpawn>350){
        const dir=i%2===0?1:-1;
        createCar(i,dir,80+Math.random()*260);
        laneSpawnAt[i]=now;
      }

      if(count===1 && now-lastSpawn>1800 && Math.random()<0.025){
        const dir=i%2===0?-1:1;
        createCar(i,dir,260+Math.random()*300);
        laneSpawnAt[i]=now;
      }
    } else {
      // NIVEL 15+: tráfico intenso.
      // Si queda vacío, reaparece rápidamente.
      if(count===0 && now-lastSpawn>220){
        const dir=i%2===0?1:-1;
        createCar(i,dir,40+Math.random()*180);
        laneSpawnAt[i]=now;
      }

      // A partir de 15, cada carril busca tener autos de ambos lados.
      const hasRight=laneCars.some(c=>c.dir===1);
      const hasLeft=laneCars.some(c=>c.dir===-1);

      if(!hasRight && now-lastSpawn>350){
        createCar(i,1,100+Math.random()*220);
        laneSpawnAt[i]=now;
      }

      if(!hasLeft && now-lastSpawn>550){
        createCar(i,-1,100+Math.random()*220);
        laneSpawnAt[i]=now;
      }

      // A veces aparece un tercer auto para que el tráfico sea realmente denso.
      const maxCars=Math.random()<0.35?3:2;
      if(count<maxCars && now-lastSpawn>850){
        const dir=Math.random()<0.5?1:-1;
        createCar(i,dir,100+Math.random()*300);
        laneSpawnAt[i]=now;
      }
    }
  }
}
function buildWorld(){
  track.innerHTML='';
  cars=[];
  obstacles=[];
  const grass=document.createElement('div');
  grass.className='zone grass';
  grass.style.top=baseRoadY()+LANE_H+'px';
  grass.style.height=Math.max(190,H()-baseRoadY()-LANE_H+150)+'px';
  track.appendChild(grass);
  for(let i=0;i<12;i++){
    const img=document.createElement('img'); img.className='grassProp'; img.src=GRASS_PROPS[i%GRASS_PROPS.length];
    img.style.width=(58+(i%3)*12)+'px'; img.style.height=img.style.width;
    img.style.left=(i%2?W()-85:12)+'px';
    img.style.top=(baseRoadY()+LANE_H+20+i*46)+'px';
    grass.appendChild(img);
  }
  // Muchos carriles adelante; solo los que entran en pantalla se ven.
  for(let i=1;i<=12;i++) createLane(i);
  renderWorld();
}

function renderWorld(){
  // El contador se sincroniza continuamente con la posición real de Kiro.
  // Así se actualiza al avanzar, sin depender de choques.
  scoreEl.textContent=row+' m';

  const lanes=track.querySelectorAll('.lane');
  lanes.forEach(l=>{
    const idx=+l.dataset.index;
    l.style.top=screenLaneY(idx)+'px';
  });
  const grass=track.querySelector('.grass');
  grass.style.top=(baseRoadY()+LANE_H+cameraY)+'px';
  grass.style.height=Math.max(190,H()-baseRoadY()-LANE_H-cameraY+170)+'px';

  cars.forEach(c=>{
    c.el.style.top=(screenLaneY(c.lane)+16)+'px';
  });

  updateKiro();
}

function reset(){
  cancelAnimationFrame(raf);
  col=2;row=0;lives=3;speed=115;cameraY=0;targetCameraY=0;laneSpawnAt={};
  moveBusy=false;running=false;
  kiro.src='Idle.png';
  kiro.className='';
  updateHud();
  buildWorld();
}

function startGame(){
  reset();
  start.style.display='none';
  over.style.display='none';
  running=true;
  last=performance.now();
  raf=requestAnimationFrame(loop);
}
function endGame(){
  running=false;
  cancelAnimationFrame(raf);
  final.textContent='Llegaste a '+row+' m';
  over.style.display='flex';
}

function animateKiro(dir){
  kiro.classList.remove('kiroMove');
  void kiro.offsetWidth;
  kiro.classList.add('kiroMove');
  kiro.src=dir==='up'?'salto.png':(dir==='left'||dir==='right'?'esquiva.png':'Idle.png');
  setTimeout(()=>{ if(running && lives>0) kiro.src='Idle.png'; },190);
}

function move(dir){
  if(!running || moveBusy) return;

  if(dir==='left'||dir==='right'){
    const next=dir==='left'?col-1:col+1;
    if(next<0||next>=COLS) return;
    col=next;
    animateKiro(dir);
    return;
  }

  if(dir==='down'){
    if(row<=0) return;
    row--;
    scoreEl.textContent=row+' m';
    // Retroceder revela de nuevo el césped.
    targetCameraY=Math.max(0,(row-2)*LANE_H);
    animateKiro('down');
    updateHud();
    return;
  }

  // AVANZAR: un escalón real.
  row++;
  scoreEl.textContent=row+' m';
  if(row%10===0){
    const badge=document.createElement('img'); badge.src='coin.png'; badge.className='effectFx'; badge.style.width='52px'; badge.style.height='52px'; badge.style.left=(colX(col)+10)+'px'; badge.style.top=(screenKiroY()-12)+'px'; track.appendChild(badge); setTimeout(()=>badge.remove(),450);
  }
  speed=Math.min(315,115+row*2.8 + Math.max(0,row-14)*2.2);

  // Al principio Kiro sube visiblemente. Después, la cámara acompaña:
  // el escenario se desliza hacia abajo y desaparece el césped.
  targetCameraY=Math.max(0,(row-2)*LANE_H);

  const highest=Math.max(...[...track.querySelectorAll('.lane')].map(x=>+x.dataset.index));
  while(row+10>highest){
    createLane(highest+1);
    highest++;
  }

  animateKiro('up');
  updateHud();
}

function collision(c){
  if(c.hit || c.lane!==row) return false;
  const cx=c.x+38;
  const kx=parseFloat(kiro.style.left)+KIRO/2;
  return Math.abs(cx-kx)<48;
}

function obstacleCollision(o){
  if(o.hit || o.lane!==row) return false;
  return o.col===col;
}

function hitObstacle(o){
  if(o.hit) return;
  o.hit=true;
  lives--;
  updateHud();
  const r=o.el.getBoundingClientRect();
  const gr=game.getBoundingClientRect();
  showHitEffect(r.left-gr.left+r.width/2, r.top-gr.top+r.height/2);
  flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
  o.el.remove();
  obstacles=obstacles.filter(x=>x!==o);
  kiro.src='golpe.pierdevida.png';
  if(lives<=0){ endGame(); return; }
  setTimeout(()=>{if(running)kiro.src='Idle.png'},650);
}

function showHitEffect(x,y){
  const fx=document.createElement('img'); fx.className='effectFx'; fx.src='explosion.png';
  fx.style.left=(x-46)+'px'; fx.style.top=(y-46)+'px'; track.appendChild(fx);
  setTimeout(()=>fx.remove(),450);
}

function hit(c){
  if(c.hit) return;
  c.hit=true;
  lives--;
  updateHud();
  flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
  showHitEffect(c.x+36, screenLaneY(c.lane)+38);
  c.el.remove();
  cars=cars.filter(x=>x!==c);
  kiro.src='golpe.pierdevida.png';
  if(lives<=0){ endGame(); return; }
  setTimeout(()=>{if(running)kiro.src='Idle.png'},650);
}

function loop(t){
  if(!running) return;
  const dt=Math.min(.035,(t-last)/1000);
  last=t;

  // Suaviza el desplazamiento de cámara: la estética avanza con la puntuación.
  cameraY += (targetCameraY-cameraY)*Math.min(1,dt*10);

  ensureTraffic(t);

  for(const c of [...cars]){
    c.x += c.dir*speed*dt;
    c.el.style.left=c.x+'px';

    if(collision(c)){ hit(c); continue; }

    if(c.x<-180 || c.x>W()+180){
      c.el.remove();
      cars=cars.filter(x=>x!==c);
    }
  }

  for(const o of [...obstacles]){
    if(obstacleCollision(o)){ hitObstacle(o); if(!running) return; }
  }

  renderWorld();
  raf=requestAnimationFrame(loop);
}

window.addEventListener('keydown',e=>{
  if(!running)return;
  const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
              w:'up',W:'up',s:'down',S:'down',a:'left',A:'left',d:'right',D:'right'};
  const dir=keys[e.key];
  if(dir){e.preventDefault();move(dir);}
});

game.addEventListener('touchstart',e=>{
  if(e.touches.length===1)
    touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});

game.addEventListener('touchend',e=>{
  if(!touchStart||!running)return;
  const dx=e.changedTouches[0].clientX-touchStart.x;
  const dy=e.changedTouches[0].clientY-touchStart.y;
  touchStart=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
},{passive:true});

window.addEventListener('resize',renderWorld);
document.querySelector('#play').onclick=startGame;
document.querySelector('#again').onclick=startGame;
reset();
</script>
</body>
</html>
