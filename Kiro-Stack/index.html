<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Kiro Stack 📚</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Press+Start+2P&display=swap');
:root{--coral:#E35D5B;--arena:#F2C6A0;--cream:#FBF6F1;--dark:#333;--grass:#B9D98B}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);color:var(--dark);font-family:"Chakra Petch",sans-serif;display:flex;justify-content:center;overflow-x:hidden;touch-action:manipulation}
.game{width:min(760px,100%);padding:14px 12px 28px}.header{background:var(--coral);border:4px solid var(--dark);border-radius:24px;box-shadow:7px 7px 0 var(--dark);padding:18px 14px 16px;text-align:center}.title{font-family:"Press Start 2P";font-size:clamp(21px,6vw,37px);color:var(--cream);text-shadow:4px 4px 0 var(--dark);line-height:1.4}.subtitle{font-size:17px;font-weight:700;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.stat{background:var(--cream);border:3px solid var(--dark);border-radius:13px;padding:9px 5px;box-shadow:3px 3px 0 var(--dark)}.label{font-size:11px;font-weight:700}.value{font-family:"Press Start 2P";font-size:15px;margin-top:6px}
.stage-wrap{position:relative;margin-top:24px;background:var(--grass);border:4px solid var(--dark);border-radius:25px;box-shadow:8px 8px 0 var(--arena);overflow:hidden}.stage{position:relative;height:620px;overflow:hidden;background:linear-gradient(to bottom,rgba(255,255,255,.15),transparent 28%),var(--grass)}
.blocks-layer{position:absolute;left:8%;right:8%;bottom:28px;height:470px;will-change:transform}.block{position:absolute;height:42px;border:0;background:transparent;filter:drop-shadow(3px 4px 0 rgba(51,51,51,.8));z-index:3}.block img.book{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}.block.moving{z-index:5}
.perfect{filter:drop-shadow(3px 4px 0 rgba(51,51,51,.8)) brightness(1.03)}
.tray{position:absolute;left:5%;right:5%;bottom:0;height:28px;border-top:4px solid var(--dark);background:rgba(51,51,51,.12)}
.start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;padding:15px 30px;background:var(--coral);color:var(--cream);border:4px solid var(--dark);border-radius:15px;box-shadow:5px 5px 0 var(--dark);font:700 19px "Chakra Petch";cursor:pointer;white-space:nowrap}.start:active{transform:translate(calc(-50% + 3px),calc(-50% + 3px));box-shadow:2px 2px 0 var(--dark)}.start.hidden{display:none}
.message{text-align:center;min-height:25px;font-weight:700;font-size:16px;margin-top:18px}.help{text-align:center;font-size:14px;opacity:.82;margin-top:8px}.overlay{position:fixed;inset:0;background:rgba(51,51,51,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.overlay.show{display:flex}.modal{width:min(500px,100%);background:var(--cream);border:4px solid var(--dark);border-radius:22px;box-shadow:9px 9px 0 var(--dark);padding:28px 22px;text-align:center}.modal h2{font-family:"Press Start 2P";font-size:16px;line-height:1.7;margin:0 0 18px}.score-big{font-family:"Press Start 2P";font-size:34px;color:var(--coral);text-shadow:3px 3px 0 var(--dark);margin:15px 0}.modal p{font-size:18px;line-height:1.4;margin:10px 0 20px}.modal .small{font-size:14px;margin-bottom:18px}.modal button{padding:13px 25px;background:var(--coral);color:var(--cream);border:4px solid var(--dark);border-radius:14px;box-shadow:4px 4px 0 var(--dark);font:700 17px "Chakra Petch";cursor:pointer}
@media(max-width:560px){.game{padding:10px 9px 22px}.header{padding:16px 10px}.stage-wrap{margin-top:18px}.stage{height:540px}.blocks-layer{left:5%;right:5%;bottom:25px;height:400px}.block{height:36px}.value{font-size:11px}.label{font-size:10px}.start{padding:12px 24px;font-size:17px}}
</style></head>
<body><div class="game"><header class="header"><div class="title">KIRO STACK 📚</div><div class="subtitle">¡Apilá los libros sin dejar caer la torre!</div><div class="stats"><div class="stat"><div class="label">ALTURA</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">RÉCORD</div><div class="value" id="record">0</div></div><div class="stat"><div class="label">VIDAS</div><div class="value" id="lives">❤️❤️❤️</div></div></div></header>
<div class="stage-wrap"><div class="stage" id="stage"><div class="blocks-layer" id="blocksLayer"></div><div class="tray"></div><button class="start" id="start">🎮 JUGAR</button></div></div>
<div class="message" id="message">Preparada para apilar 💗</div><div class="help">Tocá la pantalla, hacé clic o apretá ESPACIO para soltar cada libro.</div></div>
<div class="overlay" id="end"><div class="modal"><h2 id="endTitle">💥 ¡SE TERMINÓ!</h2><p id="endText">La torre se cayó.</p><div class="score-big" id="finalScore">0</div><p class="small" id="finalInfo"></p><button id="again">🔄 REVANCHA</button></div></div>
<script>
const stage=document.getElementById('stage'),layer=document.getElementById('blocksLayer'),startBtn=document.getElementById('start'),scoreEl=document.getElementById('score'),recordEl=document.getElementById('record'),livesEl=document.getElementById('lives'),message=document.getElementById('message'),end=document.getElementById('end'),finalScore=document.getElementById('finalScore'),finalInfo=document.getElementById('finalInfo'),endTitle=document.getElementById('endTitle'),endText=document.getElementById('endText'),again=document.getElementById('again');
const bookCount=36, bookFiles=Array.from({length:bookCount},(_,i)=>`libros/libro-${String(i+1).padStart(2,'0')}.png`);
let running=false,score=0,lives=3,record=Number(localStorage.getItem('kiroStackRecord')||0),blocks=[],moving=null,x=0,dir=1,speed=2.4,raf=null,lock=false;
recordEl.textContent=record;
function updateLives(){livesEl.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function areaWidth(){return layer.clientWidth}
function bookWidth(){return Math.min(230,areaWidth()*0.68)}
function randomBook(){return bookFiles[Math.floor(Math.random()*bookFiles.length)]}
function addBookImg(el,src){const img=document.createElement('img');img.className='book';img.src=src;img.alt='Libro';el.appendChild(img)}
function resetBoard(){layer.innerHTML='';blocks=[];moving=null;score=0;lives=3;speed=2.4;dir=1;x=0;lock=false;scoreEl.textContent='0';updateLives();layer.style.transform='translateY(0px)';
  const base=document.createElement('div');base.className='block';base.style.width=bookWidth()+'px';base.style.left=((areaWidth()-bookWidth())/2)+'px';base.style.bottom='0px';addBookImg(base,randomBook());layer.appendChild(base);blocks.push(base);score=1;scoreEl.textContent='1';}
function createMoving(){const prev=blocks[blocks.length-1];const width=prev.offsetWidth;moving=document.createElement('div');moving.className='block moving';moving.style.width=width+'px';moving.style.bottom=(blocks.length*42)+'px';moving.style.left='0px';addBookImg(moving,randomBook());layer.appendChild(moving);x=0;dir=1}
function camera(){const blockH=42;const shift=Math.max(0,blocks.length*blockH-250);layer.style.transform=`translateY(${shift}px)`}
function startGame(){cancelAnimationFrame(raf);resetBoard();running=true;startBtn.classList.add('hidden');message.textContent='¡Dale! 💥';createMoving();animate()}
function animate(){if(!running||!moving)return;const max=Math.max(0,areaWidth()-moving.offsetWidth);x+=speed*dir;if(x>=max){x=max;dir=-1}if(x<=0){x=0;dir=1}moving.style.left=x+'px';raf=requestAnimationFrame(animate)}
function drop(){if(!running||!moving||lock)return;lock=true;cancelAnimationFrame(raf);const prev=blocks[blocks.length-1],movingLeft=x,movingRight=x+moving.offsetWidth,prevLeft=parseFloat(prev.style.left)||0,prevRight=prevLeft+prev.offsetWidth,overlapLeft=Math.max(movingLeft,prevLeft),overlapRight=Math.min(movingRight,prevRight),overlap=overlapRight-overlapLeft;
 if(overlap<=2){lives--;updateLives();moving.style.transition='transform .35s ease,opacity .35s';moving.style.transform='translateY(120px) rotate('+(dir*14)+'deg)';moving.style.opacity='0';message.textContent=lives>0?'¡Se cayó! 😵':'¡La torre se fue al piso! 💥';setTimeout(()=>{moving?.remove();moving=null;lock=false;if(lives<=0)finish();else{createMoving();animate()}},360);return}
 const newWidth=overlap,newLeft=overlapLeft,perfect=Math.abs(newWidth-prev.offsetWidth)<=3;moving.style.width=newWidth+'px';moving.style.left=newLeft+'px';moving.classList.toggle('perfect',perfect);message.textContent=perfect?'¡PERFECTO! ✨':'¡Bien! 💗';blocks.push(moving);score++;scoreEl.textContent=score;if(score>record){record=score;recordEl.textContent=record;localStorage.setItem('kiroStackRecord',record)}if(score%5===0)speed+=.35;if(score>=8)speed+=.015;camera();moving=null;setTimeout(()=>{lock=false;if(running){createMoving();animate()}},90)}
function finish(){running=false;cancelAnimationFrame(raf);moving=null;finalScore.textContent=Math.max(0,score-1);endTitle.textContent='💥 ¡TORRE TERMINADA!';endText.textContent=score>=11?'¡Muy buena torre! 📚':'¡Vamos por una más alta!';finalInfo.textContent=score-1>=record?'🏆 ¡NUEVO RÉCORD!':'Altura alcanzada: '+Math.max(0,score-1);end.classList.add('show');startBtn.classList.remove('hidden');message.textContent='¿Podés superar tu récord?'}
function action(e){if(e&&e.target.closest('button'))return;drop()}stage.addEventListener('pointerdown',action);window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowDown'){e.preventDefault();drop()}});startBtn.addEventListener('click',startGame);again.addEventListener('click',()=>{end.classList.remove('show');startGame()});updateLives();window.addEventListener('resize',()=>{if(!running)return});resetBoard();
</script></body></html>
