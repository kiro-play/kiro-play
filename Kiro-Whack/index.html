<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Kiro Whack 💥</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Press+Start+2P&display=swap');

:root{
  --coral:#E35D5B;
  --arena:#F2C6A0;
  --cream:#FBF6F1;
  --dark:#333333;
  --grass:#B9D98B;
  --dirt:#6B442C
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--cream);
  color:var(--dark);
  font-family:"Chakra Petch",sans-serif;
  display:flex;
  justify-content:center;
  overflow-x:hidden
}

.game{
  width:min(760px,100%);
  padding:14px 12px 28px
}

.header{
  background:var(--coral);
  border:4px solid var(--dark);
  border-radius:24px;
  box-shadow:7px 7px 0 var(--dark);
  padding:18px 14px 16px;
  text-align:center
}

.title{
  font-family:"Press Start 2P";
  font-size:clamp(21px,6vw,37px);
  color:var(--cream);
  text-shadow:4px 4px 0 var(--dark);
  line-height:1.4
}

.subtitle{
  font-size:17px;
  font-weight:700;
  margin-top:8px
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:15px
}

.stat{
  background:var(--cream);
  border:3px solid var(--dark);
  border-radius:13px;
  padding:9px 5px;
  box-shadow:3px 3px 0 var(--dark)
}

.label{
  font-size:11px;
  font-weight:700
}

.value{
  font-family:"Press Start 2P";
  font-size:16px;
  margin-top:6px
}

.board-wrap{
  position:relative;
  margin-top:24px;
  background:var(--grass);
  border:4px solid var(--dark);
  border-radius:25px;
  padding:17px;
  box-shadow:8px 8px 0 var(--arena)
}

.board{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
  max-width:650px;
  margin:auto
}

.hole{
  position:relative;
  height:150px;
  overflow:hidden;
  border-radius:50%;
  background:radial-gradient(
    ellipse at center,
    #17120e 0 44%,
    #2b1b13 45% 55%,
    #4d2e1d 56% 68%,
    var(--dirt) 69% 100%
  );
  border:7px solid #4a2b1b;
  box-shadow:
    inset 0 9px 0 rgba(255,255,255,.08),
    0 5px 0 rgba(51,51,51,.2);
  cursor:pointer;
  touch-action:manipulation
}

.hole::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  box-shadow:inset 0 -12px 13px rgba(0,0,0,.28);
  pointer-events:none
}

.kiro{
  position:absolute;
  left:50%;
  bottom:-165px;
  transform:translateX(-50%) scale(.88);
  height:165px;
  width:auto;
  max-width:150px;
  object-fit:contain;
  z-index:2;
  pointer-events:none;
  filter:drop-shadow(0 3px 1px rgba(0,0,0,.3))
}

.hole.up .kiro{
  bottom:-25px;
  animation:jumpIn .20s ease-out
}

.hole.hit .kiro{
  display:none
}

.kiro-dizzy{
  position:absolute;
  left:50%;
  bottom:-13px;
  transform:translateX(-50%);
  height:155px;
  width:auto;
  max-width:155px;
  object-fit:contain;
  z-index:4;
  display:none;
  pointer-events:none;
  filter:drop-shadow(0 3px 1px rgba(0,0,0,.3))
}

.hole.hit .kiro-dizzy{
  display:block;
  animation:dizzy .32s ease-out
}

@keyframes jumpIn{
  0%{
    bottom:-165px;
    transform:translateX(-50%) scale(.70)
  }
  100%{
    bottom:-25px;
    transform:translateX(-50%) scale(.88)
  }
}

@keyframes dizzy{
  0%{
    transform:translateX(-50%) scale(.75) rotate(-7deg);
    opacity:.2
  }
  45%{
    transform:translateX(-50%) scale(1.02) rotate(4deg);
    opacity:1
  }
  100%{
    transform:translateX(-50%) scale(.96) rotate(0);
    opacity:1
  }
}

.points{
  position:absolute;
  z-index:7;
  font-family:"Press Start 2P";
  font-size:17px;
  color:#fff;
  left:50%;
  top:15px;
  transform:translateX(-50%);
  text-shadow:3px 3px 0 var(--dark);
  animation:float .55s ease-out forwards;
  pointer-events:none
}

@keyframes float{
  to{
    top:-17px;
    opacity:0
  }
}

.board-start{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:10;
  padding:15px 30px;
  background:var(--coral);
  color:var(--cream);
  border:4px solid var(--dark);
  border-radius:15px;
  box-shadow:5px 5px 0 var(--dark);
  font:700 19px "Chakra Petch";
  cursor:pointer;
  white-space:nowrap
}

.board-start:active{
  transform:translate(calc(-50% + 3px),calc(-50% + 3px));
  box-shadow:2px 2px 0 var(--dark)
}

.board-start.hidden{
  display:none
}

.controls{
  text-align:center;
  margin-top:18px
}

.message{
  min-height:25px;
  font-weight:700;
  font-size:16px
}

.help{
  font-size:14px;
  opacity:.82;
  margin-top:8px
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(51,51,51,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:20
}

.overlay.show{
  display:flex
}

.modal{
  width:min(500px,100%);
  background:var(--cream);
  border:4px solid var(--dark);
  border-radius:22px;
  box-shadow:9px 9px 0 var(--dark);
  padding:28px 22px;
  text-align:center
}

.modal h2{
  font-family:"Press Start 2P";
  font-size:16px;
  line-height:1.7;
  margin:0 0 18px
}

.score-big{
  font-family:"Press Start 2P";
  font-size:34px;
  color:var(--coral);
  text-shadow:3px 3px 0 var(--dark);
  margin:15px 0
}

.modal p{
  font-size:18px;
  line-height:1.4;
  margin:10px 0 20px
}

.modal .small{
  font-size:14px;
  margin-bottom:18px
}

@media(max-width:560px){

  .game{
    padding:10px 9px 22px
  }

  .header{
    padding:16px 10px
  }

  .board-wrap{
    padding:11px;
    margin-top:18px
  }

  .board{
    gap:9px
  }

  .hole{
    height:105px;
    border-width:5px
  }

  .kiro{
    height:112px;
    max-width:108px;
    bottom:-42px
  }

  .kiro-dizzy{
    height:108px;
    max-width:108px;
    bottom:-8px
  }

  .hole.up .kiro{
    bottom:-12px
  }

  .stats{
    gap:6px
  }

  .stat{
    padding:8px 3px
  }

  .value{
    font-size:12px
  }

  .label{
    font-size:10px
  }

  .board-start{
    padding:12px 24px;
    font-size:17px
  }
}
</style>
</head>

<body>

<div class="game">

<header class="header">

<div class="title">KIRO WHACK 💥</div>

<div class="subtitle">
¡Tocá a Kiro antes de que se esconda!
</div>

<div class="stats">

<div class="stat">
<div class="label">TIEMPO</div>
<div class="value" id="time">30</div>
</div>

<div class="stat">
<div class="label">PUNTOS</div>
<div class="value" id="score">0</div>
</div>

<div class="stat">
<div class="label">VIDAS</div>
<div class="value" id="lives">❤️❤️❤️</div>
</div>

</div>
</header>

<div class="board-wrap">

<div class="board" id="board"></div>

<button class="board-start" id="boardStart">
🎮 JUGAR
</button>

</div>

<div class="controls">

<div class="message" id="message">
Preparada para jugar 💗
</div>

<div class="help">
Kiro aparece de a uno. Tocá a Kiro para sumar puntos. Si se escapa, perdés una vida.
</div>

</div>

</div>

<div class="overlay" id="end">

<div class="modal">

<h2 id="endTitle">
💥 ¡SE TERMINÓ!
</h2>

<p id="endText">
Kiro ganó la escondida 😌
</p>

<div class="score-big" id="finalScore">
0
</div>

<p class="small" id="finalInfo"></p>

<button id="again">
🔄 REVANCHA
</button>

</div>

</div>

<script>

const board=document.getElementById("board"),
timeEl=document.getElementById("time"),
scoreEl=document.getElementById("score"),
livesEl=document.getElementById("lives");

const boardStart=document.getElementById("boardStart"),
againBtn=document.getElementById("again"),
end=document.getElementById("end"),
finalScore=document.getElementById("finalScore"),
endTitle=document.getElementById("endTitle"),
endText=document.getElementById("endText"),
finalInfo=document.getElementById("finalInfo"),
message=document.getElementById("message");

let holes=[],
score=0,
time=30,
lives=3,
running=false,
timer=null,
hideTimer=null,
current=-1,
hitLock=false;

let record=Number(
  localStorage.getItem("kiroWhackRecord")||0
);

for(let i=0;i<9;i++){

  const hole=document.createElement("div");
  hole.className="hole";

  const img=document.createElement("img");
  img.className="kiro";
  img.src="kiro-jump.png";
  img.alt="Kiro";

  const dizzy=document.createElement("img");
  dizzy.className="kiro-dizzy";
  dizzy.src="kiro-dizzy.png";
  dizzy.alt="Kiro mareado";

  hole.append(img,dizzy);
  board.appendChild(hole);
  holes.push(hole);

  hole.dataset.index=i;
  hole.addEventListener("pointerdown",hit);
}

function updateLives(){

  livesEl.textContent=
    "❤️".repeat(lives)+
    "🖤".repeat(3-lives);

}

function hit(e){

  if(!running||!e.isPrimary||hitLock)return;

  const hole=e.currentTarget;

  if(!hole.classList.contains("up"))return;

  hitLock=true;

  score++;
  scoreEl.textContent=score;

  clearTimeout(hideTimer);

  hole.classList.remove("up");
  hole.classList.add("hit");

  const p=document.createElement("div");

  p.className="points";
  p.textContent="+1";

  hole.appendChild(p);

  setTimeout(()=>p.remove(),550);

  setTimeout(()=>{

    hole.classList.remove("hit");
    current=-1;
    hitLock=false;

    if(running)setTimeout(spawn,120);

  },320);
}

const isMobile =
  window.matchMedia("(pointer: coarse)").matches ||
  window.innerWidth <= 700;

function timing(){

  const elapsed=30-time;

  if(isMobile){

    return {
      visible:Math.max(
        440,
        1180-elapsed*29
      ),

      pause:Math.max(
        70,
        390-elapsed*11
      )
    };

  }

  return {
    visible:Math.max(
      620,
      1300-elapsed*23
    ),

    pause:Math.max(
      120,
      420-elapsed*10
    )
  };
}

function hide(){

  if(current>=0)
    holes[current].classList.remove("up","hit");

  current=-1;

  clearTimeout(hideTimer);
}

function miss(){

  if(!running||hitLock)return;

  lives--;
  updateLives();

  message.textContent=
    lives>0
      ?"¡Se escapó! 😵"
      :"¡Se escaparon demasiados!";

  if(lives<=0){

    finish(false);
    return;

  }

  current=-1;

  setTimeout(spawn,140);
}

function spawn(){

  if(!running||hitLock)return;

  hide();

  let next=
    Math.floor(
      Math.random()*holes.length
    );

  if(next===current)
    next=(next+1)%holes.length;

  current=next;

  const hole=holes[next];

  hole.classList.add("up");

  const t=timing();

  hideTimer=setTimeout(()=>{

    if(!running||current!==next||hitLock)
      return;

    hole.classList.remove("up");

    current=-1;

    miss();

  },t.visible);
}

function startGame(){

  clearInterval(timer);
  clearTimeout(hideTimer);

  hitLock=false;

  holes.forEach(h=>
    h.classList.remove("up","hit")
  );

  score=0;
  time=30;
  lives=3;
  current=-1;
  running=true;

  scoreEl.textContent="0";
  timeEl.textContent="30";

  updateLives();

  message.textContent="¡Dale! 💥";

  boardStart.classList.add("hidden");

  spawn();

  timer=setInterval(()=>{

    time--;

    timeEl.textContent=time;

    if(time<=0)
      finish(true);

  },1000);
}

function finish(timeUp){

  if(!running)return;

  running=false;

  clearInterval(timer);
  clearTimeout(hideTimer);

  hide();

  hitLock=false;

  finalScore.textContent=score;

  const oldRecord=record;

  if(score>record){

    record=score;

    localStorage.setItem(
      "kiroWhackRecord",
      record
    );
  }

  if(timeUp){

    endTitle.textContent="⏱️ ¡TIEMPO!";

    endText.textContent=
      "¡Sobreviviste los 30 segundos!";

  }else{

    endTitle.textContent="💥 ¡Kiro ganó!";

    endText.textContent=
      "Te quedaste sin vidas 😵‍💫";

  }

  finalInfo.textContent=
    score>oldRecord
      ?"🏆 ¡NUEVO RÉCORD!"
      :"Puntaje final: "+score;

  end.classList.add("show");

  boardStart.classList.remove("hidden");

  message.textContent=
    "¿Podés superarlo?";
}

againBtn.addEventListener(
  "click",
  ()=>{
    end.classList.remove("show");
    startGame();
  }
);

boardStart.addEventListener(
  "click",
  startGame
);

updateLives();

</script>

</body>
</html>
